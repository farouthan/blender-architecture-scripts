<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNES Social Analysis Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
/* ================================================================
   CSS RESET & CUSTOM PROPERTIES
   ================================================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-viewport: #0a0a0a;
  --bg-controller: #111111;
  --bg-card: #1a1a1e;
  --bg-card-hover: #222226;
  --border-card: #2a2a2e;
  --border-subtle: #1f1f23;
  --text-primary: #e8e8ec;
  --text-secondary: #8a8a94;
  --text-dim: #5a5a64;
  --gp-color: #00a651;
  --robi-color: #c4161c;
  --airtel-color: #ed1c24;
  --banglalink-color: #f26522;
  --accent-purple: #7c5cbf;
  --accent-cyan: #22d3ee;
  --snes-body: #3a3a42;
  --snes-body-light: #55555e;
  --snes-body-dark: #222228;
  --snes-dpad: #2a2a30;
  --btn-a: #cc3333;
  --btn-a-dark: #992222;
  --btn-b: #ccaa22;
  --btn-b-dark: #887711;
  --btn-x: #3366aa;
  --btn-x-dark: #224477;
  --btn-y: #44aa44;
  --btn-y-dark: #227722;
  --transition-fast: 150ms ease;
  --transition-med: 300ms ease;
  --transition-slow: 500ms ease;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --font-en: 'Inter', sans-serif;
  --font-bn: 'Noto Sans Bengali', sans-serif;
}
html, body {
  height: 100%; width: 100%;
  font-family: var(--font-en);
  background: var(--bg-viewport);
  color: var(--text-primary);
  overflow: hidden;
}
body { display: flex; flex-direction: column; }

/* ================================================================
   SCROLLBAR
   ================================================================ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #555; }

/* ================================================================
   LAYOUT: SPLIT SCREEN
   ================================================================ */
#viewport {
  flex: 1;
  background: var(--bg-viewport);
  overflow-y: auto;
  position: relative;
  display: flex;
  flex-direction: column;
}
#controller-area {
  flex: 0 0 340px;
  background: var(--bg-controller);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  border-top: 1px solid #1a1a1e;
  overflow: hidden;
}

/* ================================================================
   VIEWPORT HEADER
   ================================================================ */
#viewport-header {
  padding: 16px 24px 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(8px);
  z-index: 10;
  position: sticky;
  top: 0;
}
.filter-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  flex: 1;
}
.filter-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: #1e1e24;
  border: 1px solid #2e2e34;
  border-radius: 20px;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: default;
  transition: all var(--transition-fast);
}
.filter-pill .remove-pill {
  cursor: pointer;
  opacity: 0.5;
  font-size: 13px;
  line-height: 1;
}
.filter-pill .remove-pill:hover { opacity: 1; color: #ff6b6b; }
.filter-dropdown {
  position: relative;
  display: inline-block;
}
.filter-dropdown select {
  appearance: none;
  background: #141418;
  border: 1px solid #2a2a2e;
  color: var(--text-secondary);
  padding: 6px 28px 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-family: var(--font-en);
  cursor: pointer;
  transition: all var(--transition-fast);
  outline: none;
}
.filter-dropdown select:hover { border-color: #3a3a3e; color: var(--text-primary); }
.filter-dropdown select:focus { border-color: var(--accent-purple); }
.filter-dropdown::after {
  content: '\25BE';
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
  font-size: 10px;
}
.timeline-bar {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 0 0;
}
.timeline-track {
  flex: 1;
  height: 4px;
  background: #1a1a1e;
  border-radius: 2px;
  position: relative;
}
.timeline-progress {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
  border-radius: 2px;
  transition: width var(--transition-med);
}
.timeline-label {
  font-size: 11px;
  color: var(--text-dim);
  white-space: nowrap;
  min-width: 120px;
  text-align: right;
}
.zoom-indicator {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--accent-purple);
  padding: 3px 8px;
  border: 1px solid rgba(124,92,191,0.3);
  border-radius: var(--radius-sm);
}

/* ================================================================
   VIEWPORT CONTENT
   ================================================================ */
#viewport-content {
  flex: 1;
  padding: 20px 24px;
  position: relative;
}
.view-container {
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ================================================================
   SUMMARY VIEW
   ================================================================ */
.summary-hero {
  text-align: center;
  padding: 48px 0 36px;
}
.summary-hero h1 {
  font-size: 42px;
  font-weight: 300;
  letter-spacing: -1px;
  margin-bottom: 8px;
}
.summary-hero h1 span { font-weight: 700; }
.summary-hero .summary-sub {
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.summary-hero .summary-range {
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.brand-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  max-width: 900px;
  margin: 0 auto;
  padding-top: 20px;
}
.brand-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-md);
  padding: 24px 20px;
  text-align: center;
  border-top: 3px solid var(--text-dim);
  transition: all var(--transition-med);
  cursor: pointer;
  animation: cardIn 0.4s ease backwards;
}
.brand-card:nth-child(1) { border-top-color: var(--gp-color); animation-delay: 0.05s; }
.brand-card:nth-child(2) { border-top-color: var(--robi-color); animation-delay: 0.1s; }
.brand-card:nth-child(3) { border-top-color: var(--airtel-color); animation-delay: 0.15s; }
.brand-card:nth-child(4) { border-top-color: var(--banglalink-color); animation-delay: 0.2s; }
.brand-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.brand-card .brand-name { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.brand-card .brand-count { font-size: 32px; font-weight: 700; margin-bottom: 4px; }
.brand-card .brand-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.brand-card .brand-engagement {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border-card);
  font-size: 12px;
  color: var(--text-secondary);
}

/* ================================================================
   POST VIEW (A)
   ================================================================ */
.post-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.post-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-md);
  padding: 18px;
  cursor: pointer;
  transition: all var(--transition-med);
  animation: cardIn 0.4s ease backwards;
}
.post-card:hover { background: var(--bg-card-hover); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
.post-card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.brand-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.brand-dot.gp { background: var(--gp-color); }
.brand-dot.robi { background: var(--robi-color); }
.brand-dot.airtel { background: var(--airtel-color); }
.brand-dot.banglalink { background: var(--banglalink-color); }
.post-brand-name { font-size: 12px; font-weight: 600; }
.post-date { font-size: 11px; color: var(--text-dim); margin-left: auto; }
.post-caption {
  font-family: var(--font-bn);
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.post-caption.expanded {
  -webkit-line-clamp: unset;
  overflow: visible;
}
.post-stats {
  display: flex;
  gap: 16px;
  margin-bottom: 10px;
}
.post-stat {
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 4px;
}
.post-stat .stat-icon { font-size: 13px; }
.post-stat .stat-val { color: var(--text-secondary); font-weight: 500; }
.post-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.post-tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  background: #141418;
  color: var(--text-dim);
  border: 1px solid #1e1e24;
}
.post-url-link {
  display: block;
  margin-top: 10px;
  font-size: 11px;
  color: var(--accent-cyan);
  text-decoration: none;
  opacity: 0.7;
}
.post-url-link:hover { opacity: 1; text-decoration: underline; }

/* ================================================================
   CAPTION VIEW (B)
   ================================================================ */
.caption-search {
  position: relative;
  margin-bottom: 20px;
}
.caption-search input {
  width: 100%;
  padding: 12px 16px 12px 40px;
  background: #141418;
  border: 1px solid #2a2a2e;
  border-radius: var(--radius-md);
  color: var(--text-primary);
  font-size: 14px;
  font-family: var(--font-en);
  outline: none;
  transition: all var(--transition-fast);
}
.caption-search input:focus { border-color: var(--btn-b); box-shadow: 0 0 0 2px rgba(204,170,34,0.15); }
.caption-search input::placeholder { color: var(--text-dim); }
.caption-search .search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 14px;
}
.caption-feed { display: flex; flex-direction: column; gap: 2px; }
.caption-item {
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  transition: background var(--transition-fast);
  animation: cardIn 0.3s ease backwards;
}
.caption-item:hover { background: #141418; }
.caption-item-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.caption-item .caption-text {
  font-family: var(--font-bn);
  font-size: 15px;
  line-height: 1.7;
  color: var(--text-secondary);
}
.caption-item .caption-text mark {
  background: rgba(204,170,34,0.3);
  color: var(--text-primary);
  border-radius: 2px;
  padding: 0 2px;
}

/* ================================================================
   IMAGE VIEW (X)
   ================================================================ */
.image-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.image-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-md);
  padding: 18px;
  animation: cardIn 0.4s ease backwards;
  transition: all var(--transition-med);
}
.image-card:hover { background: var(--bg-card-hover); }
.image-card .image-text-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.image-card .image-text-value {
  font-family: var(--font-bn);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text-primary);
  margin-bottom: 14px;
}
.image-card .image-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  margin-bottom: 12px;
  padding: 10px;
  background: #111115;
  border-radius: var(--radius-sm);
  border-left: 2px solid var(--btn-x);
}
.image-card .image-style-tag {
  display: inline-block;
  font-size: 11px;
  padding: 3px 10px;
  background: rgba(51,102,170,0.15);
  color: var(--btn-x);
  border-radius: 10px;
  margin-bottom: 10px;
}
.image-tags-list {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.image-tag-pill {
  font-size: 10px;
  padding: 2px 8px;
  background: #1a1a22;
  color: var(--text-dim);
  border-radius: 8px;
  border: 1px solid #222228;
}

/* ================================================================
   HEADLINE VIEW (Y)
   ================================================================ */
.headline-list {
  max-width: 700px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.headline-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  transition: background var(--transition-fast);
  animation: cardIn 0.3s ease backwards;
}
.headline-item:hover { background: #141418; }
.headline-text {
  font-family: var(--font-bn);
  font-size: 18px;
  line-height: 1.5;
  color: var(--text-primary);
  font-weight: 500;
}
.headline-date {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  white-space: nowrap;
}

/* ================================================================
   ENGAGEMENT OVERLAY (R SHOULDER)
   ================================================================ */
.engagement-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10,10,10,0.88);
  backdrop-filter: blur(12px);
  z-index: 20;
  padding: 24px;
  overflow-y: auto;
  animation: fadeIn 0.3s ease;
  display: none;
}
.engagement-overlay.active { display: block; }
.engagement-overlay h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  color: var(--text-primary);
}
.charts-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}
.chart-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-md);
  padding: 20px;
}
.chart-panel h3 {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 16px;
}
.chart-panel canvas { width: 100% !important; max-height: 260px; }

/* ================================================================
   BRIEF VIEW (L SHOULDER)
   ================================================================ */
.brief-container {
  max-width: 800px;
  margin: 0 auto;
  animation: fadeIn 0.4s ease;
}
.brief-document {
  background: #f5f0e8;
  color: #1a1a1a;
  border-radius: var(--radius-md);
  padding: 48px 56px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
  font-family: var(--font-en);
  position: relative;
}
.brief-document::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 27px,
    rgba(0,0,0,0.03) 27px,
    rgba(0,0,0,0.03) 28px
  );
  pointer-events: none;
  border-radius: var(--radius-md);
}
.brief-header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 2px solid #d4c9b5;
}
.brief-header h2 {
  font-size: 22px;
  font-weight: 700;
  color: #1a1a1a;
  margin-bottom: 4px;
}
.brief-header .brief-subtitle {
  font-size: 13px;
  color: #666;
}
.brief-section {
  margin-bottom: 28px;
}
.brief-section h3 {
  font-size: 14px;
  font-weight: 700;
  color: #333;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid #d4c9b5;
}
.brief-section p, .brief-section li {
  font-size: 13px;
  line-height: 1.7;
  color: #444;
}
.brief-section ul { padding-left: 20px; }
.brief-section li { margin-bottom: 4px; }
.brief-stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 12px;
}
.brief-stat {
  text-align: center;
  padding: 12px;
  background: rgba(0,0,0,0.04);
  border-radius: var(--radius-sm);
}
.brief-stat .stat-value { font-size: 24px; font-weight: 700; color: #1a1a1a; }
.brief-stat .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
.brief-content-split { margin-bottom: 12px; }
.brief-bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.brief-bar-label { font-size: 12px; color: #555; width: 100px; text-align: right; }
.brief-bar-track { flex: 1; height: 18px; background: #e8e0d4; border-radius: 3px; overflow: hidden; }
.brief-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.brief-bar-val { font-size: 11px; color: #777; width: 40px; }
.brief-template-box {
  border: 2px dashed #c4b89c;
  border-radius: var(--radius-sm);
  padding: 20px;
  background: rgba(0,0,0,0.02);
  margin-top: 12px;
}
.brief-template-box h4 {
  font-size: 13px;
  font-weight: 600;
  color: #555;
  margin-bottom: 10px;
}
.brief-template-box p {
  font-size: 12px;
  font-style: italic;
  color: #666;
  line-height: 1.8;
}
.brief-word-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 12px 0;
}
.brief-word {
  font-size: 13px;
  color: #555;
  padding: 4px 10px;
  background: rgba(0,0,0,0.04);
  border-radius: 12px;
}
.brief-word.large { font-size: 18px; font-weight: 600; color: #333; }
.brief-word.medium { font-size: 15px; font-weight: 500; color: #444; }

/* ================================================================
   SELECT OVERLAY
   ================================================================ */
.select-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(16px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease;
}
.select-overlay.active { display: flex; }
.select-panel {
  background: #161619;
  border: 1px solid #2a2a2e;
  border-radius: var(--radius-lg);
  padding: 32px;
  width: 480px;
  max-width: 90vw;
}
.select-panel h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 24px;
  text-align: center;
}
.select-section {
  margin-bottom: 24px;
}
.select-section label {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-bottom: 10px;
}
.brand-toggles {
  display: flex;
  gap: 8px;
}
.brand-toggle {
  flex: 1;
  padding: 10px 8px;
  border: 2px solid var(--border-card);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  font-family: var(--font-en);
  cursor: pointer;
  text-align: center;
  transition: all var(--transition-fast);
}
.brand-toggle.active { border-color: currentColor; color: var(--text-primary); background: rgba(255,255,255,0.03); }
.brand-toggle[data-brand="Grameenphone"].active { border-color: var(--gp-color); color: var(--gp-color); }
.brand-toggle[data-brand="Robi"].active { border-color: var(--robi-color); color: var(--robi-color); }
.brand-toggle[data-brand="Airtel"].active { border-color: var(--airtel-color); color: var(--airtel-color); }
.brand-toggle[data-brand="Banglalink"].active { border-color: var(--banglalink-color); color: var(--banglalink-color); }
.date-inputs {
  display: flex;
  gap: 12px;
}
.date-inputs input {
  flex: 1;
  padding: 10px 12px;
  background: #0e0e12;
  border: 1px solid #2a2a2e;
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-size: 13px;
  font-family: var(--font-en);
  outline: none;

  'Airtel': { color: '#ed1c24', short: 'Airtel', cssClass: 'airtel' },
  'Banglalink': { color: '#f26522', short: 'BL', cssClass: 'banglalink' }
};
const BRAND_NAMES = Object.keys(BRANDS);

/* ================================================================
   STATE
   ================================================================ */
const state = {
  currentView: 'summary',
  zoomLevel: 'industry',
  currentBrandIndex: 0,
  timelinePosition: null,
  filters: {
    brands: [...BRAND_NAMES],
    type: '',
    topic: '',
    tactic: '',
    format: '',
    dateFrom: '2025-09-01',
    dateTo: '2026-02-28',
    searchQuery: ''
  },
  engagementOverlay: false,
  briefMode: false,
  selectOverlayOpen: false
};

let chartInstances = {};
let longPressTimer = null;

/* ================================================================
   FILTER ENGINE
   ================================================================ */
function filterPosts() {
  let posts = [...DATA];
  const f = state.filters;

  // Brand filter
  if (f.brands.length < BRAND_NAMES.length) {
    posts = posts.filter(p => f.brands.includes(p.brand));
  }

  // Zoom level: brand view shows only current brand
  if (state.zoomLevel === 'brand') {
    const brandName = BRAND_NAMES[state.currentBrandIndex];
    if (f.brands.includes(brandName)) {
      posts = posts.filter(p => p.brand === brandName);
    }
  }

  // Date range
  if (f.dateFrom) posts = posts.filter(p => p.date >= f.dateFrom);
  if (f.dateTo) posts = posts.filter(p => p.date <= f.dateTo);

  // Timeline position
  if (state.timelinePosition) {
    const tp = state.timelinePosition;
    if (state.zoomLevel === 'brand') {
      // Day level
      posts = posts.filter(p => p.date === tp);
    } else {
      // Month level
      const ym = tp.substring(0, 7);
      posts = posts.filter(p => p.date.substring(0, 7) === ym);
    }
  }

  // Dropdown filters
  if (f.type) posts = posts.filter(p => p.type === f.type);
  if (f.topic) posts = posts.filter(p => p.topic === f.topic);
  if (f.tactic) posts = posts.filter(p => p.tactic === f.tactic);
  if (f.format) posts = posts.filter(p => p.format === f.format);

  // Search
  if (f.searchQuery) {
    const q = f.searchQuery.toLowerCase();
    posts = posts.filter(p =>
      p.caption.toLowerCase().includes(q) ||
      (p.image_text && p.image_text.toLowerCase().includes(q))
    );
  }

  // Sort by date desc
  posts.sort((a, b) => b.date.localeCompare(a.date));
  return posts;
}

/* ================================================================
   RENDERING
   ================================================================ */
function render() {
  renderFilterPills();
  updateZoomIndicator();
  updateTimeline();
  updateActiveButtons();

  const content = document.getElementById('viewport-content');
  const posts = filterPosts();

  if (state.briefMode) {
    renderBrief(content, posts);
  } else {
    switch (state.currentView) {
      case 'summary': renderSummary(content, posts); break;
      case 'post': renderPostView(content, posts); break;
      case 'caption': renderCaptionView(content, posts); break;
      case 'image': renderImageView(content, posts); break;
      case 'headline': renderHeadlineView(content, posts); break;
    }
  }

  // Engagement overlay
  const eo = document.getElementById('engagement-overlay');
  if (state.engagementOverlay) {
    eo.classList.add('active');
    renderCharts(posts);
  } else {
    eo.classList.remove('active');
  }
}

  const topicCounts = {};
  const tacticCounts = {};
  const formatCounts = {};
  const wordFreq = {};
  let totalEng = 0;

  allFiltered.forEach(p => {
    typeCounts[p.type] = (typeCounts[p.type] || 0) + 1;
    topicCounts[p.topic] = (topicCounts[p.topic] || 0) + 1;

    formatCounts[p.format] = (formatCounts[p.format] || 0) + 1;

    // Word freq from image_text
    if (p.image_text) {
      p.image_text.split(/\s+/).forEach(w => {

                  <span class="brief-bar-label">${e[0]}</span>
                  <div class="brief-bar-track"><div class="brief-bar-fill" style="width:${pct}%; background:${barColors[i % barColors.length]}"></div></div>
                  <span class="brief-bar-val">${pct}%</span>
                </div>`;
              }).join('')}
            </div>
          </div>

          <div class="brief-section">
            <h3>Topic Distribution</h3>
            <div class="brief-content-split">
              ${Object.entries(topicCounts).sort((a,b) => b[1] - a[1]).map((e, i) => {
                const pct = Math.round((e[1] / total) * 100);
                return `<div class="brief-bar-row">
                  <span class="brief-bar-label">${e[0]}</span>
                  <div class="brief-bar-track"><div class="brief-bar-fill" style="width:${pct}%; background:${barColors[(i+2) % barColors.length]}"></div></div>

/* ================================================================
   CHARTS (R SHOULDER)
   ================================================================ */
function renderCharts(posts) {
  // Destroy old charts
  Object.values(chartInstances).forEach(c => c.destroy());
  chartInstances = {};

  if (!posts.length) return;

  const brandColors = BRAND_NAMES.map(b => BRANDS[b].color);

  // 1. Brand engagement bar chart
  const brandEng = {};
  BRAND_NAMES.forEach(b => brandEng[b] = { reactions: 0, comments: 0, shares: 0 });
  posts.forEach(p => {
    if (brandEng[p.brand]) {
      brandEng[p.brand].reactions += p.reactions;
      brandEng[p.brand].comments += p.comments;
      brandEng[p.brand].shares += p.shares;
    }
  });

  const ctx1 = document.getElementById('chart-brand-engagement');
  if (ctx1) {
    chartInstances.brandEng = new Chart(ctx1, {
      type: 'bar',
      data: {
        labels: BRAND_NAMES.map(b => BRANDS[b].short),
        datasets: [
          { label: 'Reactions', data: BRAND_NAMES.map(b => brandEng[b].reactions), backgroundColor: 'rgba(204,51,51,0.7)' },
          { label: 'Comments', data: BRAND_NAMES.map(b => brandEng[b].comments), backgroundColor: 'rgba(51,102,170,0.7)' },
          { label: 'Shares', data: BRAND_NAMES.map(b => brandEng[b].shares), backgroundColor: 'rgba(68,170,68,0.7)' }
        ]
      },
      options: chartDefaults('bar')
    });
  }

  // 2. Type distribution doughnut
  const typeCounts = {};
  posts.forEach(p => typeCounts[p.type] = (typeCounts[p.type] || 0) + 1);
  const typeEntries = Object.entries(typeCounts).sort((a,b) => b[1] - a[1]);

  const ctx2 = document.getElementById('chart-type-dist');
  if (ctx2) {
    chartInstances.typeDist = new Chart(ctx2, {
      type: 'doughnut',
      data: {
        labels: typeEntries.map(e => e[0]),
        datasets: [{
          data: typeEntries.map(e => e[1]),
          backgroundColor: ['#cc3333','#3366aa','#44aa44','#ccaa22','#f26522','#7c5cbf','#22d3ee','#888']
        }]
      },
      options: {
        ...chartDefaults('doughnut'),
        cutout: '60%',
        plugins: {
          legend: { position: 'right', labels: { color: '#8a8a94', font: { size: 11 }, padding: 8 } }
        }
      }
    });
  }

  // 3. Timeline
  const monthlyPosts = {};
  posts.forEach(p => {
    const ym = p.date.substring(0, 7);
    monthlyPosts[ym] = (monthlyPosts[ym] || 0) + 1;
  });
  const months = Object.keys(monthlyPosts).sort();

  const ctx3 = document.getElementById('chart-timeline');
  if (ctx3) {
    chartInstances.timeline = new Chart(ctx3, {
      type: 'line',
      data: {
        labels: months,
        datasets: [{
          label: 'Posts',
          data: months.map(m => monthlyPosts[m]),
          borderColor: '#7c5cbf',
          backgroundColor: 'rgba(124,92,191,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 4,
          pointBackgroundColor: '#7c5cbf'
        }]
      },
      options: chartDefaults('line')
    });
  }

  // 4. Top posts horizontal bar
  const topPosts = [...posts].sort((a,b) => (b.reactions+b.comments+b.shares) - (a.reactions+a.comments+a.shares)).slice(0, 6);
  const ctx4 = document.getElementById('chart-top-posts');
  if (ctx4) {
    chartInstances.topPosts = new Chart(ctx4, {
      type: 'bar',
      data: {
        labels: topPosts.map(p => truncate(p.image_text || p.caption, 25)),
        datasets: [{
          label: 'Total Engagement',
          data: topPosts.map(p => p.reactions + p.comments + p.shares),
          backgroundColor: topPosts.map(p => BRANDS[p.brand].color + 'bb')
        }]
      },
      options: { ...chartDefaults('bar'), indexAxis: 'y' }
    });
  }
}

function chartDefaults(type) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: type === 'doughnut' ? undefined : { display: false }
    },
    scales: type === 'doughnut' ? undefined : {
      x: { ticks: { color: '#5a5a64', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } },
      y: { ticks: { color: '#5a5a64', font: { size: 10 } }, grid: { color: 'rgba(255,255,255,0.03)' } }
    }
  };
}

/* ================================================================
   FILTER PILLS
   ================================================================ */
function renderFilterPills() {
  const el = document.getElementById('filter-pills');
  const pills = [];
  const f = state.filters;

  if (f.brands.length < BRAND_NAMES.length) {
    f.brands.forEach(b => pills.push({ label: b, key: 'brand', value: b }));
  }
  if (f.type) pills.push({ label: `Type: ${f.type}`, key: 'type', value: f.type });
  if (f.topic) pills.push({ label: `Topic: ${f.topic}`, key: 'topic', value: f.topic });
  if (f.tactic) pills.push({ label: `Tactic: ${f.tactic}`, key: 'tactic', value: f.tactic });
  if (f.format) pills.push({ label: `Format: ${f.format}`, key: 'format', value: f.format });
  if (state.zoomLevel === 'brand') {
    pills.push({ label: `Brand: ${BRAND_NAMES[state.currentBrandIndex]}`, key: 'zoom', value: '' });
  }
  if (state.timelinePosition) {
    pills.push({ label: `Time: ${state.timelinePosition}`, key: 'timeline', value: '' });
  }

  el.innerHTML = pills.map(p => `
    <span class="filter-pill">
      ${p.label}
      <span class="remove-pill" onclick="removePill('${p.key}', '${p.value}')">&times;</span>
    </span>
  `).join('');
}

function removePill(key, value) {
  if (key === 'brand') {
    state.filters.brands = state.filters.brands.filter(b => b !== value);
    if (!state.filters.brands.length) state.filters.brands = [...BRAND_NAMES];
  } else if (key === 'type') { state.filters.type = ''; document.getElementById('filter-type').value = ''; }
  else if (key === 'topic') { state.filters.topic = ''; document.getElementById('filter-topic').value = ''; }
  else if (key === 'tactic') { state.filters.tactic = ''; document.getElementById('filter-tactic').value = ''; }
  else if (key === 'format') { state.filters.format = ''; document.getElementById('filter-format').value = ''; }
  else if (key === 'zoom') { state.zoomLevel = 'industry'; }
  else if (key === 'timeline') { state.timelinePosition = null; }
  render();
}

function applyDropdownFilter(key, value) {
  state.filters[key] = value;
  render();
}

/* ================================================================
   ZOOM & TIMELINE
   ================================================================ */
function updateZoomIndicator() {
  const el = document.getElementById('zoom-indicator');
  if (state.zoomLevel === 'brand') {
    const b = BRAND_NAMES[state.currentBrandIndex];
    el.textContent = BRANDS[b].short;
    el.style.color = BRANDS[b].color;
    el.style.borderColor = BRANDS[b].color + '44';
  } else {
    el.textContent = 'INDUSTRY';
    el.style.color = '';
    el.style.borderColor = '';
  }
}

function updateTimeline() {
  const bar = document.getElementById('timeline-bar');
  if (!state.timelinePosition) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';

  const minDate = new Date('2025-09-01');
  const maxDate = new Date('2026-02-28');
  const cur = new Date(state.timelinePosition);
  const range = maxDate - minDate;
  const pos = cur - minDate;
  const pct = Math.max(0, Math.min(100, (pos / range) * 100));

  document.getElementById('timeline-progress').style.width = pct + '%';
  document.getElementById('timeline-label').textContent = state.timelinePosition;
}

function scrubTimeline(direction) {
  const allDates = DATA.map(p => p.date).sort();
  const minDate = allDates[0] || '2025-09-01';
  const maxDate = allDates[allDates.length - 1] || '2026-02-28';

  if (!state.timelinePosition) {
    state.timelinePosition = direction > 0 ? minDate : maxDate;
    render();
    return;
  }

  const d = new Date(state.timelinePosition);
  if (state.zoomLevel === 'brand') {
    d.setDate(d.getDate() + direction);
  } else {
    d.setMonth(d.getMonth() + direction);
    d.setDate(1);
  }

  const iso = d.toISOString().split('T')[0];
  if (iso >= minDate && iso <= maxDate) {
    state.timelinePosition = iso;
  }
  render();
}

/* ================================================================
   CONTROLLER ACTIONS
   ================================================================ */
function handleButton(btn) {
  // Visual press feedback
  const el = document.getElementById(btn.length <= 2 ? `btn-${btn}` : `dpad-${btn}`);
  if (el) {
    el.style.transform = el.style.transform || '';
    el.classList.add('pressed');
    setTimeout(() => el.classList.remove('pressed'), 150);
  }

  switch (btn) {
    case 'up':
      state.zoomLevel = 'industry';
      state.timelinePosition = null;
      render();
      break;
    case 'down':
      if (state.zoomLevel === 'brand') {
        state.currentBrandIndex = (state.currentBrandIndex + 1) % BRAND_NAMES.length;
      }
      state.zoomLevel = 'brand';
      render();
      break;
    case 'left':
      scrubTimeline(-1);
      break;
    case 'right':
      scrubTimeline(1);
      break;
    case 'a':
      state.currentView = 'post';
      state.briefMode = false;
      render();
      break;
    case 'b':
      state.currentView = 'caption';
      state.briefMode = false;
      render();
      break;
    case 'x':
      state.currentView = 'image';
      state.briefMode = false;
      render();
      break;
    case 'y':
      state.currentView = 'headline';
      state.briefMode = false;
      render();
      break;
    case 'rb':
      state.engagementOverlay = !state.engagementOverlay;
      render();
      break;
    case 'lb':
      state.briefMode = !state.briefMode;
      if (state.briefMode) state.engagementOverlay = false;
      render();
      break;
    case 'select':
      state.selectOverlayOpen = !state.selectOverlayOpen;
      document.getElementById('select-overlay').classList.toggle('active', state.selectOverlayOpen);
      break;
    case 'start':
      state.timelinePosition = null;
      render();
      break;
  }
}

function updateActiveButtons() {
  // Clear all active states
  document.querySelectorAll('.face-btn').forEach(b => b.classList.remove('active-view'));
  document.querySelectorAll('.shoulder-btn').forEach(b => b.classList.remove('active'));

  // Set active face button
  if (!state.briefMode) {
    const map = { post: 'btn-a', caption: 'btn-b', image: 'btn-x', headline: 'btn-y' };
    const id = map[state.currentView];
    if (id) document.getElementById(id)?.classList.add('active-view');
  }

  // Shoulder states
  if (state.engagementOverlay) document.getElementById('btn-rb').classList.add('active');
  if (state.briefMode) document.getElementById('btn-lb').classList.add('active');
}

/* ================================================================
   LONG PRESS (START)
   ================================================================ */
function startLongPress() {
  longPressTimer = setTimeout(() => {
    // Reset everything
    state.currentView = 'summary';
    state.zoomLevel = 'industry';
    state.currentBrandIndex = 0;
    state.timelinePosition = null;
    state.filters = {
      brands: [...BRAND_NAMES],
      type: '', topic: '', tactic: '', format: '',
      dateFrom: '2025-09-01', dateTo: '2026-02-28',
      searchQuery: ''
    };
    state.engagementOverlay = false;
    state.briefMode = false;
    // Reset dropdowns
    document.querySelectorAll('.filter-dropdown select').forEach(s => s.value = '');
    render();
    longPressTimer = null;
  }, 800);
}

function endLongPress() {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
    handleButton('start');
  }
}

/* ================================================================
   SELECT OVERLAY
   ================================================================ */
function toggleBrandSelect(btn) {
  btn.classList.toggle('active');
}

function setPreset(preset) {
  const fromEl = document.getElementById('date-from');
  const toEl = document.getElementById('date-to');
  if (preset === 'thisMonth') {
    fromEl.value = '2026-02-01'; toEl.value = '2026-02-28';
  } else if (preset === 'last3') {
    fromEl.value = '2025-12-01'; toEl.value = '2026-02-28';
  } else {
    fromEl.value = '2025-09-01'; toEl.value = '2026-02-28';
  }
}

function closeSelectOverlay() {
  state.selectOverlayOpen = false;
  document.getElementById('select-overlay').classList.remove('active');
}

function applySelectOverlay() {
  // Collect brand toggles
  const toggles = document.querySelectorAll('.brand-toggle');
  const selected = [];
  toggles.forEach(t => { if (t.classList.contains('active')) selected.push(t.dataset.brand); });
  state.filters.brands = selected.length ? selected : [...BRAND_NAMES];

  // Date range
  state.filters.dateFrom = document.getElementById('date-from').value;
  state.filters.dateTo = document.getElementById('date-to').value;

  closeSelectOverlay();
  render();
}

function selectBrand(brand) {
  state.zoomLevel = 'brand';
  state.currentBrandIndex = BRAND_NAMES.indexOf(brand);
  state.currentView = 'post';
  state.briefMode = false;
  render();
}

/* ================================================================
   UTILITIES
   ================================================================ */
function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function truncate(str, len) {
  if (!str) return '';
  return str.length > len ? str.substring(0, len) + '...' : str;
}

function highlightSearch(text) {
  if (!state.filters.searchQuery) return text;
  const q = escapeHtml(state.filters.searchQuery);
  const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(regex, '<mark>$1</mark>');
}

let searchDebounce = null;
function debouncedSearch(value) {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    state.filters.searchQuery = value;
    render();
    // Re-focus input
    setTimeout(() => {
      const input = document.getElementById('caption-search-input');
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    }, 10);
  }, 200);
}

function togglePostExpand(card) {
  const caption = card.querySelector('.post-caption');
  const link = card.querySelector('.post-url-link');
  if (caption) caption.classList.toggle('expanded');
  if (link) link.style.display = link.style.display === 'none' ? 'block' : 'none';
}

function emptyState(msg) {
  return `<div class="view-container"><div class="empty-state"><div class="empty-icon">&#x1F50D;</div><p>${msg}</p></div></div>`;
}

/* ================================================================
   KEYBOARD SUPPORT
   ================================================================ */
document.addEventListener('keydown', (e) => {
  // Don't capture when typing in inputs
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

  const keyMap = {
    'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right',
    'a': 'a', 'A': 'a', 'b': 'b', 'B': 'b', 'x': 'x', 'X': 'x', 'y': 'y', 'Y': 'y',
    'r': 'rb', 'R': 'rb', 'l': 'lb', 'L': 'lb',
    'Enter': 'start', ' ': 'select', 'Escape': 'select'
  };

  const btn = keyMap[e.key];
  if (btn) {
    e.preventDefault();
    handleButton(btn);

    // Visual feedback on controller button
    const elId = btn.length <= 2 ?
      (btn === 'up' || btn === 'down' || btn === 'left' || btn === 'right' ? `dpad-${btn}` : `btn-${btn}`) :
      `btn-${btn}`;
    const el = document.getElementById(elId);
    if (el) {
      el.style.filter = 'brightness(1.3)';
      setTimeout(() => { el.style.filter = ''; }, 200);
    }
  }
});

/* ================================================================
   INIT
   ================================================================ */
Chart.defaults.color = '#8a8a94';
Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';
Chart.defaults.font.family = "'Inter', sans-serif";
Chart.defaults.font.size = 11;

render();
</script>
